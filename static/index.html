<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 Music Library</title>
<link rel="stylesheet" href="/static/css/main.css">
<link rel="stylesheet" href="/static/css/layout.css">
<link rel="stylesheet" href="/static/css/components.css">
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="logo">
    <span class="logo-mark">🎵</span>
    <span class="logo-name">Music Library</span>
  </div>

  <nav class="nav">
    <a class="nav-item" data-view="home" href="#home">
      <span class="nav-icon">🏠</span><span class="nav-label">Home</span>
    </a>
    <a class="nav-item" data-view="songs" href="#songs">
      <span class="nav-icon">🎵</span><span class="nav-label">All Songs</span>
    </a>
    <a class="nav-item" data-view="favorites" href="#favorites">
      <span class="nav-icon">❤️</span><span class="nav-label">Favorites</span>
    </a>
    <a class="nav-item" data-view="playlists" href="#playlists">
      <span class="nav-icon">📋</span><span class="nav-label">Playlists</span>
    </a>
    <a class="nav-item" data-view="youtube" href="#youtube">
      <span class="nav-icon">📥</span><span class="nav-label">YouTube</span>
    </a>
  </nav>

  <div class="sidebar-bottom">
    <button class="btn btn-primary full" id="btnUpload">📤 Upload Audio</button>
    <button class="icon-btn small" id="btnTheme" title="Theme">🌙</button>
  </div>
</aside>

<main class="main">
  <header class="topbar">
    <button class="icon-btn hamburger" id="btnMenu">☰</button>
    <div class="search">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search songs, artists...">
    </div>
    <select id="sortSelect" class="select">
      <option value="date">Newest</option>
      <option value="title">Title A-Z</option>
      <option value="artist">Artist A-Z</option>
      <option value="duration">Duration</option>
    </select>
  </header>

  <section class="view" id="view"></section>
</main>

<div class="player" id="player">
  <div class="player-art" id="playerArt">🎵</div>
  <div class="player-meta">
    <div class="player-title" id="playerTitle">No track playing</div>
    <div class="player-artist" id="playerArtist">—</div>
  </div>
  <div class="player-controls">
    <button class="icon-btn" id="btnShuffle" title="Shuffle">🔀</button>
    <button class="icon-btn" id="btnPrev" title="Previous">⏮</button>
    <button class="icon-btn play" id="btnPlay" title="Play">▶️</button>
    <button class="icon-btn" id="btnNext" title="Next">⏭</button>
    <button class="icon-btn" id="btnRepeat" title="Repeat">🔁</button>
  </div>
  <div class="player-progress">
    <span class="time" id="timeNow">0:00</span>
    <div class="bar" id="bar">
      <div class="bar-fill" id="barFill"></div>
      <div class="bar-thumb" id="barThumb"></div>
      <input type="range" id="barRange" min="0" max="100" value="0" step="0.1">
    </div>
    <span class="time" id="timeEnd">0:00</span>
  </div>
  <div class="player-volume">
    <span>🔊</span>
    <input type="range" id="volumeRange" min="0" max="100" value="80">
  </div>
</div>

<!-- Upload modal -->
<div class="modal-overlay" id="uploadModal">
  <div class="modal">
    <div class="modal-head">
      <h3>📤 Upload Audio</h3>
      <button class="icon-btn" data-close="uploadModal">✕</button>
    </div>
    <div class="drop-zone" id="dropZone">
      <p>📁 Drag & drop MP3 / M4A / WEBM here</p>
      <p class="dim">or</p>
      <button class="btn btn-secondary" id="btnBrowse">Browse Files</button>
      <input type="file" id="fileInput" accept=".mp3,.m4a,.webm" multiple hidden>
    </div>
    <div class="field"><label>Title (optional)</label><input id="uploadTitle"></div>
    <div class="field"><label>Artist (optional)</label><input id="uploadArtist"></div>
    <div class="status" id="uploadStatus"></div>
  </div>
</div>

<!-- Add to playlist modal -->
<div class="modal-overlay" id="addToPlaylistModal">
  <div class="modal">
    <div class="modal-head">
      <h3>📋 Add to Playlist</h3>
      <button class="icon-btn" data-close="addToPlaylistModal">✕</button>
    </div>

    <div class="add-track-preview" id="addTrackPreview"></div>

    <div class="field">
      <label>Create a new playlist</label>
      <div class="row-input">
        <input id="newPlaylistInput" placeholder="Playlist name">
        <button class="btn btn-primary" id="btnCreatePlaylist">Create</button>
      </div>
    </div>

    <div class="divider">or pick one below</div>

    <div class="playlist-picker" id="playlistPicker"></div>
  </div>
</div>

<!-- Create playlist modal -->
<div class="modal-overlay" id="createPlaylistModal">
  <div class="modal" style="max-width:420px;">
    <div class="modal-head">
      <h3>📋 New Playlist</h3>
      <button class="icon-btn" data-close="createPlaylistModal">✕</button>
    </div>
    <div class="field">
      <label>Playlist name</label>
      <input id="newPlaylistNameInput" placeholder="e.g. Workout, Chill, Coding">
    </div>
    <button class="btn btn-primary full" id="btnConfirmCreatePlaylist">Create Playlist</button>
    <div class="status" id="createPlaylistStatus"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/static/js/api.js"></script>
<script src="/static/js/state.js"></script>
<script src="/static/js/ui.js"></script>
<script src="/static/js/player.js"></script>
<script src="/static/js/library.js"></script>
<script src="/static/js/playlists.js"></script>
<script src="/static/js/downloader.js"></script>
<script src="/static/js/upload.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
